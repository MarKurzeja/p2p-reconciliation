name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Part A: generate data, validate against answer key (must be 100%), run SQL"
        run: python run.py check

      - name: "Part B: audit analytics on the committed 2025 data"
        run: python run.py analyze
